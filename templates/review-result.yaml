# templates/review-result.yaml — Review Result（Reviewer Workflow 产出）

# 字段冻结（11 项，见 protocols/review-adapter.md §5）
# finding 结构从 RR schemas/finding.json 迁移，去 gate 化（见文末注释）

type: review_result
task_id: ""
review_id: ""

# ── P0-5 正式 Review Result Schema（冻结，禁止 LGTM/Looks good/Approved/PASS 单独作为 evidence）──
# status+verification+evidence+decision.rationale 缺一不可；evidence 遵循 Agent OS Evidence schema
# （source/timestamp/status ∈ UNVERIFIED|PARTIALLY_VERIFIED|VERIFIED|DISPUTED|OBSOLETE），不另造模型。
review:
  status: ""                 # approved | rework_required | blocked
  findings:
    - id: "FIND-001"
      severity: ""           # P0 | P1 | P2 | P3
      category: ""           # correctness | security | protocol | test | repository | readiness
      evidence: ""           # 必须引用 §1 事实输入（git diff / 测试结果 / 仓库状态 / 执行证据 / 产物）
      required_action: ""
  verification:
    tests:      { status: "", evidence: "" }   # status: PASS | FAIL | NOT_RUN
    protocol:   { status: "", evidence: "" }
    security:   { status: "", evidence: "" }
    repository: { status: "", evidence: "" }
    readiness:  { status: "", evidence: "" }
  decision:
    rationale: ""             # 必须给出判定理由，不能只写 LGTM / Looks good / Approved / PASS

# Reviewer 执行状态：COMPLETED | INCOMPLETE | BLOCKED
status: ""

# 独立验证子步骤（强制）
independent_verification:
  performed: true            # 是否执行独立验证
  code_read: true            # 是否独立读取代码
  git_diff_reviewed: true    # 是否独立审查 Git Diff

# 独立复跑的测试
tests_reproduced:
  executed: []
  passed: []
  failed: []

# NONE | MINOR | BLOCKING
regression_status: ""

# 需求 / IDEAL 符合性
requirement_compliance:
  status: ""                 # PASS | FAIL | N/A
  unmet: []                  # 未满足的验收条件

# 分类 findings（每项结构见文末注释）
code_findings: []            # 代码/架构 finding
security_findings: []        # 安全 finding
repository_findings: []      # 仓库整洁/一致性 finding

# 项目交付（完整可独立运行项目）时的强制检查结果
project_delivery:
  github_hygiene:
    status: ""              # PASS | NOT_APPLICABLE | FAIL
    checks: []               # 各项：README 根目录 / 无临时文件 / 无 __pycache__ / 无 .env / 无 secrets / 无本地绝对路径 / .gitignore 正确 / 结构清晰 / commit 清晰 / LICENSE / CHANGELOG
  stranger_user_audit:
    status: ""              # PASS | NOT_APPLICABLE | NOT_RUN | REJECT
    steps: []                # clone / install / config / quickstart / run / test 每步 PASS|FAIL|NOT_RUN
    summary: ""
  readiness_check:
    status: ""              # PASS | FAIL | NOT_RUN（scripts/project-readiness-check.sh）
    defects: []

# Reviewer 审查结论（review_gate）：表示「当前变更是否具备进入后续 Git/Push/Release 流程」。
# ⚠️ 这不是真正的 GitHub Release Gate（后者见 protocols/release.md，含 version/CHANGELOG 前置条件）。
review_gate:
  tests_pass: false
  independent_verification_pass: false
  review_approved: false
  repository_clean: false
  # 仅标记状态（true|false|not_applicable），不代表可直接 Release；真正 Release Gate 见 release.md
  version_ready: not_applicable
  changelog_ready: not_applicable

# APPROVED | REWORK_REQUIRED
final_decision: ""

# 必须修复项（final_decision=REWORK_REQUIRED 时非空）
required_actions: []

# OpenClaw Native Compliance（涉及 OpenClaw 能力时填写，见 review-adapter.md §3.3a）
openclaw_compliance:
  # PASS | FINDINGS | NOT_APPLICABLE（非 OpenClaw 任务填 NOT_APPLICABLE）
  status: ""
  # finding 结构与 code_findings 一致：severity / file / message / required_action
  findings: []

# Protocol Compliance（交付物为 Skill/Agent/Project 时强制，见 review-adapter.md §3.7）
# 非生成物（仅改既有业务代码）标 NOT_APPLICABLE 合法。
protocol_compliance:
  status: ""                 # PASS | FAIL | NOT_APPLICABLE（FAIL → REJECT，Release BLOCKED）
  artifact_type: ""          # skill | agent | project | not_applicable
  agent_os_protocol: "v1.3"  # 对齐当前 Agent OS Protocol
  checks:
    - item: "x-agent-os 声明存在"       # Identity
      result: ""              # PASS | FAIL | N/A
      note: ""
    - item: "protocol_version 匹配当前 Protocol (v1.3)"
      result: ""
      note: ""
    - item: "layer/path/entry_mode/requires 符合 SKILL-INTEGRATION"
      result: ""
      note: ""
    - item: "无虚构字段（不自行发明协议字段）"
      result: ""
      note: ""
    - item: "适用 checklist 逐项满足（PROTOCOL-CHECKLIST 14 项）"
      result: ""
      note: ""
    - item: "N/A 项有合理理由"
      result: ""
      note: ""
    - item: "Multi-Agent 适用场景声明 delegation"
      result: ""
      note: ""
    - item: "Execution Record 能证明经过规定节点"
      result: ""
      note: ""
    - item: "经过规定节点（context/goal/permission/execution/verification）"
      result: ""
      note: ""
  blocking_reason: []        # FAIL 时的阻断原因

# ── finding 结构（从 RR schemas/finding.json 迁移，去 gate 化，P0-5 增加 category）───────────
# 每项 finding 形如：
#   id: FIND-xxx                    # 唯一 id（P0-5 新增）
#   severity: P0 | P1 | P2 | P3     # P0=安全/破坏性 → 直接 REWORK_REQUIRED；P1=必须修复；P2/P3=建议
#   category: correctness | security | protocol | test | repository | readiness   # P0-5 新增
#   evidence: "..."                 # 必须引用事实输入，禁止用 Developer/Main Agent 自评替代
#   file: <path>
#   message: "..."
#   required_action: "..."
