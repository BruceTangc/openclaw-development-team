# templates/requirement-result.yaml — Requirement Specification（Requirement Analyst 产出）
type: requirement_result
task_id: DT-YYYYMMDD-001
user_request: "用户原话，原样保留"
goal: "一句话目标"
problem: "要解决的问题 / 动机"
expected_outcome: "成功的可观察结果"
functional_requirements:
  - "FR-1: 具体功能点，可验证"
non_functional_requirements:
  - "NFR-1: 性能/兼容/安全/可维护等"
constraints:
  - "硬约束：技术栈/平台/范围/安全"
scope:
  included:
    - "在范围内"
  excluded:
    - "明确排除"
assumptions:
  - "低风险推断，已标注（不是事实）"
unknowns:
  - "重大未知，可能触发 HUMAN_DECISION_REQUIRED"
acceptance_criteria:
  - "可验证成功条件（V2 可观测）"
risk_level: MEDIUM          # LOW | MEDIUM | HIGH | CRITICAL
recommended_path: STANDARD  # FAST | STANDARD | FULL（路由建议，最终 Lead 定）
