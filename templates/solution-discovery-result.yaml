# templates/solution-discovery-result.yaml — Solution Discovery Result（Solution Researcher 产出）
type: solution_discovery_result
task_id: DT-YYYYMMDD-001
search_scope:
  - "① 当前 Repository"
  - "② Agent OS"
  - "③ OpenClaw"
  - "④ 已装 Skills"
  - "⑤ GitHub"
  - "⑥ 官方 API/SDK"
  - "⑦ 其他开源"
candidates:
  - name: "候选项目名"
    repository: "owner/repo 或 URL"
    purpose: "一句话用途"
    license: "MIT / Apache-2.0 / GPL / 无"
    maintenance: "活跃 / 停滞 / 归档（最近提交 / 星标 / 贡献者）"
    architecture_summary: "架构概览"
    relevant_features:
      - "与本需求相关的特性"
    compatibility: "与技术栈/平台兼容性"
    security_notes: "依赖风险 / CVE / 供应链注意"
    reuse_level: ADAPT          # DIRECT_REUSE | ADAPT | LEARN_AND_BUILD | NOT_SUITABLE
    pros:
      - "利"
    cons:
      - "弊"
recommendation: "推荐哪个候选 + 复用级别 | NO_SUITABLE_EXISTING_SOLUTION"
reason: "为什么这么建议"
evidence: "仓库链接 / 搜索关键词 / 命中摘要（非空，禁止空口）"
